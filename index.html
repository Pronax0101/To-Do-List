<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>TO-Do List</title>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <h1>To-Do List</h1>

      <form onsubmit="return adicionarTarefa(event)">
        <input type="text" id="inputElement" name="inputElement" placeholder="Digite sua tarefa aqui">
        <input type="submit" value="+">
      </form>

      <ul id="listElement">
      </ul>
    </div>
  </div>




  <script src="script.js"></script>
</body>
</html>
